
name: Extended CI
env:
  DEBUG: napi:*
  PEDANTIC: true

on:
  push:
    # Currently we create tags before triggering a release. 
    # This setup ensures that we run this workflow before the release.
    tags:
      - "*"  
  workflow_dispatch:
    
jobs:
  # The goal of this workflow is to check if examples run without any errors
  # This is a version that tests the full matrix of supported node versions and driver architectures
  extended-examples-test:
    strategy:
      fail-fast: false
      matrix:
        host:
        - ubuntu-latest
        - ubuntu-24.04-arm
        node: [ 20, 22, 24, current ]
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm 
            target: aarch64-unknown-linux-gnu 
            build: npm run build -- --target aarch64-unknown-linux-gnu
    name: Build and run examples - ${{ matrix.target }} - node@${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/common/setup
        with:
          host: ${{ matrix.host }}
          target: ${{ matrix.target }}
          node-version: ${{ matrix.node }}
      - uses: ./.github/common/example
        with:
          build-command: ${{ matrix.build }}
  extended-integration-tests:
    strategy:
      fail-fast: false
      matrix:
        host:
          - ubuntu-latest
          - ubuntu-24.04-arm
        node: [ 20, 22, 24, current ]
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            scylla_arch: x86_64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            scylla_arch: aarch64
        exclude:
          - host: ubuntu-24.04-arm
            node: 22
          - host: ubuntu-24.04-arm
            node: 24
          - host: ubuntu-24.04-arm
            node: current
    name: Build and run integration tests - ${{ matrix.target }} - node@${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/common/setup
        with:
          host: ${{ matrix.host }}
          target: ${{ matrix.target }}
          node-version: ${{ matrix.node }}
      - uses: ./.github/common/integration
        with:
          build-command: npm run build:test -- --target ${{ matrix.target }}
          scylla-arch: ${{ matrix.scylla_arch }}
