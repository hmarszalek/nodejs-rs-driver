# The goal of this workflow is to check if unit test run correctly
# This includes both datastax unit tests and tests specific for this driver
name: Run unit tests
env:
  DEBUG: napi:*
  PEDANTIC: true
"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-and-run-tests:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    name: Build and run unit tests - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/common/setup
        with:
          host: ${{ matrix.settings.host }}
          target: ${{ matrix.settings.target }}
      - name: Build
        run: npm run build -- --target ${{ matrix.settings.target }}
        shell: bash
      - name: Run unit tests
        run: npm run unit
      - name: Run unit tests with expose-gc
        run: npm run unit-gc
        shell: bash
      - name: Run not fully integrated unit tests
        run: npm run unit-not-supported
